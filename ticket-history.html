<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이용권 사용 내역</title>
    <link rel="stylesheet" href="src/styles/app.css" />
  </head>
  <body>
    <main class="ticket-history app-screen" data-component="ticket-history" aria-labelledby="ticket-history-title">
      <header class="ticket-history__header app-header">
        <button class="ticket-history__back app-header__button" type="button" data-action="go-back" aria-label="이용권 내역으로 돌아가기">
          <img src="assets/icons/iconBack.svg" alt="" />
        </button>
        <h1 class="ticket-history__title app-header__title" id="ticket-history-title">이용권 사용 내역</h1>
        <span aria-hidden="true"></span>
      </header>

      <div class="ticket-history__content">
        <section class="ticket-summary" aria-label="이용권 요약">
          <p class="ticket-history__notice" data-field="availability-notice"></p>
          <div class="ticket-summary__heading">
            <div>
              <p class="ticket-summary__business" data-field="business-name"></p>
              <h2 class="ticket-summary__name" data-field="ticket-name"></h2>
            </div>
            <span class="ticket-summary__phone" role="img" aria-label="전화 아이콘">
              <img src="assets/icons/iconCall.svg" width="24" height="24" alt="" />
            </span>
          </div>
          <p class="ticket-summary__meta" data-field="ticket-meta"></p>
        </section>

        <section class="ticket-information" aria-labelledby="ticket-status-title">
          <h2 class="ticket-information__title section-title" id="ticket-status-title">이용권 상태</h2>
          <dl class="ticket-information__list">
            <dt>지급일</dt><dd data-field="issued-date"></dd>
            <dt>개시일</dt><dd data-field="start-date"></dd>
            <dt>만료일</dt><dd data-field="expiry-date"></dd>
            <dt>예약 가능 날짜</dt><dd data-field="reservation-date-range"></dd>
          </dl>
        </section>

        <section class="ticket-usage" aria-labelledby="ticket-usage-title">
          <h2 class="ticket-usage__title section-title" id="ticket-usage-title">사용 내역</h2>
          <div class="ticket-usage__list" data-field="usage-list"></div>
        </section>
      </div>
    </main>

    <script type="module" src="src/ticket-history-main.js"></script>
  </body>
</html>
